<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <title>{{ title }} - Camino Network</title>
        <meta name="description" content="{{ description }}" />
        <meta charset="UTF-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        {% if noindex %}
        <meta name="robots" content="noindex" />
        {% else %}
        <link rel="canonical" href="https://camino.network{{ page.url }}" />
        {% endif %}
        {% if keywords %}
        <meta name="keywords" content="{{keywords}}">
        {% endif %}

        <!-- CSS -->
        <link rel="stylesheet" href="/style.css?v={% version %}" />
        <link rel="stylesheet" href="/sal.css?v={% version %}" />

        <!-- JS -->
        <script src="/js/alpine.js?v={% version %}" defer></script>
        <script src="/js/sal.js?v={% version %}"></script>
        <script src="/js/css-doodle.js?v={% version %}"></script>

        <!-- Favicons and theme color -->
        <link rel="icon" href="/favicon.ico" type="image/x-icon" />
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />   
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="msapplication-TileColor" content="#020617">
        <meta name="theme-color" content="#020617">

        <!-- Facebook Meta Tags -->
        <meta property="og:url" content="https://camino.network{{ page.url }}" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="{{title}} - Camino Network" />
        <meta property="og:description" content="{{description}}" />
        <meta property="og:image" content="https://camino.network{% if socialImage %}/{{socialImage}}.png{% else %}/social.png{% endif %}" />

        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@camino_network" />
        <meta name="twitter:title" content="{{title}} - Camino Network" />
        <meta name="twitter:description" content="{{description}}" />
        <meta name="twitter:image"  content="https://camino.network{% if socialImage %}/{{socialImage}}.png{% else %}/social.png{% endif %}" />
        {% if placement == "homepage" %}
        <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","@id":"https://camino.network/#website","url":"https://camino.network/","name":"Camino Network","inLanguage":"en","description":"Camino Network is a Layer 1 blockchain for the travel industry with an EVM-compatible C-Chain. This site links to its wallet, explorer, RPC endpoints, documentation and source code."}</script>
        {% endif %}

</head>
    <body class="overflow-x-hidden bg-gray-950 text-gray-50 selection:bg-primary selection:text-caminoSky" style="--sal-duration: .5s;">
        {% include "header.html" %}
        {{ content | safe }}
        {% include "footer.html" %}
    </body>
    
    <script>
        sal()
    </script>
</html>
